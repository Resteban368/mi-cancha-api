<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/admin/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/admin/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/admin/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b1f28" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Mi Cancha · Admin</title>
    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo (ver src/lib/theme.ts).
      (function () {
        try {
          var m = localStorage.getItem('mi-cancha-theme');
          var dark = m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.dataset.theme = dark ? 'dark' : 'light';
          r.dataset.mode = m === 'dark' || m === 'light' ? m : 'system';
          var t = document.querySelector('meta[name="theme-color"]');
          if (t) t.setAttribute('content', dark ? '#0b1f28' : '#f8fafc');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
