    <!--faq-ld-->

    <script>
      // Marca que hay JavaScript (activa las animaciones de entrada) y aplica el tema antes de pintar.
      (function () {
        var r = document.documentElement;
        r.classList.add('js');
        try {
          var dark = matchMedia('(prefers-color-scheme: dark)').matches;
          r.dataset.theme = dark ? 'dark' : 'light';
          var t = document.querySelector('meta[name="theme-color"]');
          if (t) t.setAttribute('content', dark ? '#0b1f28' : '#f8fafc');
        } catch (e) {}
      })();
    </script>
